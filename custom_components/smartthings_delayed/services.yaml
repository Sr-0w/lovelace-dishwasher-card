schedule_start:
  name: Schedule dishwasher start
  description: Schedule a delayed dishwasher cycle using the connected official SmartThings client.
  fields:
    entity_id:
      name: Dishwasher companion sensor
      description: Any sensor provided by this SmartThings Dishwasher Delayed Start integration.
      required: true
      selector:
        entity:
          domain: sensor
          integration: smartthings_delayed
    delay_minutes:
      name: Time before starting
      description: Number of minutes until the cycle starts (1–1440).
      required: true
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
    dry_run:
      name: Check without programming
      description: Validate the device and requested delay without sending SmartThings commands.
      required: false
      default: false
      selector:
        boolean:
